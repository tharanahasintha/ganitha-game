name: Build and deploy Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore private answer key for tests
        env:
          QUIZ_ANSWER_KEY_JSON: ${{ secrets.QUIZ_ANSWER_KEY_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const value = process.env.QUIZ_ANSWER_KEY_JSON;
          if (!value) {
            throw new Error('Missing QUIZ_ANSWER_KEY_JSON repository secret');
          }

          JSON.parse(value);
          fs.mkdirSync('private', { recursive: true });
          fs.writeFileSync('private/answer-key.json', value, { mode: 0o600 });
          NODE
      - run: npm test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
